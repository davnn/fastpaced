<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="preload" href="/assets/fonts/eb-garamond-subset.woff2" as="font" type="font/woff2" crossorigin>
    $partial("templates/partials/theme.html")$
    <link rel="manifest" href="/assets/manifest/manifest.json">
    <link rel="alternate" type="application/atom+xml" title="$title$" href="$site$/atom.xml">
    <link rel="canonical" href="$site$$url$">
    $if(mathematics)$
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="$katexBase$katex.min.css">
    $endif$
    <title>$title$</title>
    <meta name="description" content="$if(abstract)$$abstract$$else$$defaultdescription$$endif$">
    <meta property="og:url" content="$site$$url$">
    <meta property="og:type" content="website">
    <meta property="og:title" content="$title$">
    <meta property="og:site_name" content="fastpaced">
    <meta property="og:description" content="$if(abstract)$$abstract$$else$$defaultdescription$$endif$">
    <meta property="og:image" content="$imageUrl$">
    <script type="application/ld+json">
        $siteSchema$
    </script>
    <style>
        $partial("assets/style.css")$
    </style>
</head>

<body>
    $partial("templates/partials/header.html")$
    <main id="$layout$">
        $body$
    </main>
    $partial("templates/partials/footer.html")$
</body>

</html>
