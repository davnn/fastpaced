on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize ]

name: build
jobs:
  run:
    name: Build hakyll site
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish gh-pages; Dependabot PR tokens remain read-only.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup stack
        id: setup
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: 'latest'

      - name: Restore cached dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        env:
          key: ${{ runner.os }}-stack-${{ steps.setup.outputs.stack-version }}
        with:
          path: ${{ steps.setup.outputs.stack-root }}
          key: ${{ env.key }}-package-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: ${{ env.key }}-

      - name: Test browser scripts
        run: node tests/browser_scripts.cjs

      - name: Build project
        run: stack build --ghc-options=-Werror

      # Cache dependencies already here, so that we do not have to rebuild them should the subsequent steps fail.
      - name: Save cached dependencies
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # If we had an exact cache hit, trying to save the cache would error because of key clash.
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.stack-root }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build site
        run: stack exec fastpaced build

      - name: Install build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/site-tools"
          "$RUNNER_TEMP/site-tools/bin/python" -m pip install -r tools/requirements.txt

      - name: Test Python checks
        run: '"$RUNNER_TEMP/site-tools/bin/python" -m unittest discover -s tests -p "*.py"'

      - name: Optimize generated pages
        run: |
          "$RUNNER_TEMP/site-tools/bin/python" tools/optimize_images.py
          "$RUNNER_TEMP/site-tools/bin/python" tools/optimize_site.py
          "$RUNNER_TEMP/site-tools/bin/python" tools/subset_font.py --check

      - name: Deploy site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
